<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskManager</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="eyebrow">Programación de Sistemas Web</p>
      <h1>TaskManager</h1>
    </div>
  </header>

  <main class="container">
    <section class="stats" aria-label="Métricas">
      <div class="stat">
        <span class="stat-label">Total</span>
        <span class="stat-value" id="stat-total">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Pendientes</span>
        <span class="stat-value" id="stat-pending">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Completadas</span>
        <span class="stat-value" id="stat-completed">0</span>
      </div>
    </section>

    <section class="panel">
      <form id="task-form" class="task-form" novalidate>
        <div class="field field-title">
          <label for="task-title">Título</label>
          <input type="text" id="task-title" name="title" maxlength="120" autocomplete="off">
        </div>
        <div class="field field-priority">
          <label for="task-priority">Prioridad</label>
          <select id="task-priority" name="priority">
            <option value="">Seleccionar</option>
            <option value="alta">Alta</option>
            <option value="media">Media</option>
            <option value="baja">Baja</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="form-submit">Agregar</button>
          <button type="button" class="btn btn-ghost" id="form-cancel" hidden>Cancelar</button>
        </div>
        <p class="form-error" id="form-error" role="alert"></p>
      </form>
    </section>

    <section class="toolbar" aria-label="Filtros">
      <input type="search" id="search" class="search" placeholder="Buscar por título" autocomplete="off">
      <div class="filters" role="group" aria-label="Estado">
        <button type="button" class="filter is-active" data-filter="todas">Todas</button>
        <button type="button" class="filter" data-filter="pendientes">Pendientes</button>
        <button type="button" class="filter" data-filter="completadas">Completadas</button>
      </div>
      <select id="sort" class="sort" aria-label="Ordenar">
        <option value="fecha-desc">Más recientes</option>
        <option value="fecha-asc">Más antiguas</option>
        <option value="prioridad-desc">Prioridad: alta a baja</option>
        <option value="prioridad-asc">Prioridad: baja a alta</option>
      </select>
    </section>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty-state" class="empty-state">No hay tareas para mostrar.</p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
